<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Свежие страницы игр Steam с идеями для двухдневных прототипов в Roblox.">
  <title>Game Tracker — Steam</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/tracker.js"></script>
</head>
<body id="top">
  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="brand">
        <img src="/assets/logo-duck-places.png" alt="" class="brand-logo" width="52" height="52">
        <span class="brand-text">Game Tracker</span>
      </a>
      <nav class="main-nav" id="mainNav" aria-label="Основное меню">
        <a href="#top" class="nav-link">Home</a>
        <a href="#games" class="nav-link nav-link-active" aria-current="page">Games</a>
        <a href="https://duckplaces.com/careers" class="nav-link">Careers</a>
        <a href="https://duckplaces.com/#contact" class="nav-link nav-link-primary">Contact Us</a>
      </nav>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Меню" aria-controls="mainNav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="section-games-hero">
      <div class="container section-header">
        <div class="eyebrow">STEAM · ROBLOX IDEAS</div>
        <h1>Найди идею для следующей игры.</h1>
        <p>Свежие страницы Steam с механиками, которые можно попробовать собрать в Roblox за два дня.</p>
      </div>
    </section>

    <section class="container catalogue" id="games" aria-label="Лента игр">
      <div class="catalog-toolbar">
        <label class="search-wrap">
          <span class="sr-only">Поиск игр</span>
          <input id="gameSearch" type="search" placeholder="Найти игру…" autocomplete="off">
        </label>
        <label>
          <span class="sr-only">Механика</span>
          <select id="gameFilter">
            <option value="">Все механики</option>
            <option value="incremental">Инкрементал</option>
            <option value="physics">Физика и машины</option>
            <option value="party">Пати и PvP</option>
            <option value="simulator">Симулятор</option>
          </select>
        </label>
        <label>
          <span class="sr-only">Сортировка</span>
          <select id="gameSort">
            <option value="newest">Сначала свежие</option>
            <option value="fit">Ближе к примерам</option>
            <option value="name">По названию</option>
          </select>
        </label>
        <span class="catalog-count" id="gameCount" aria-live="polite"></span>
      </div>
      <div class="feed-line">
        <p id="feedStatus" role="status"><span class="status-dot"></span> Подключаемся к Steam…</p>
        <button id="refresh" class="refresh" type="button">↻ Обновить</button>
      </div>
      <div class="games-grid" id="gameGrid" aria-busy="true"></div>
      <p class="empty-state" id="emptyState" hidden></p>
      <noscript><p class="empty-state">Включи JavaScript, чтобы увидеть ленту Steam.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img src="/assets/logo-duck-places.png" alt="" width="48" height="48">
        <div><strong>Game Tracker</strong><p>Идеи для небольших игр в Roblox.</p></div>
      </div>
      <div class="theme-buttons" role="group" aria-label="Цветовая тема">
        <button type="button" data-theme-choice="light" aria-label="Светлая" title="Светлая"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-theme-choice="system" aria-label="Системная" title="Системная"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6m-3-4v4"/></svg></button>
        <button type="button" data-theme-choice="dark" aria-label="Тёмная" title="Тёмная"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 1 1 11 3.2 9 9 0 0 0 20.8 13Z"/></svg></button>
      </div>
    </div>
  </footer>
</body>
</html>
